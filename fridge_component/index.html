<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { --steel:#D5DBE0; --steel-dark:#B9C2C9; --steel-edge:#9AA5AE; --inside:#EEF5F8; --inside-shade:#D9E6EC;
    --ink:#1C2329; --ink-soft:#5B6770; }
  * { box-sizing:border-box; }
  body { margin:0; background:transparent; color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  .stage { display:flex; flex-direction:column; align-items:center; padding-top:8px; }
  .fridge { position:relative; width:340px; height:600px; perspective:1500px; cursor:pointer; }
  .fridge:focus-visible { outline:3px solid #2E6FE8; outline-offset:8px; border-radius:18px; }
  .cabinet { position:absolute; inset:0; border-radius:18px; background:linear-gradient(180deg,var(--inside),var(--inside-shade));
    box-shadow:inset 0 0 0 10px var(--steel-dark), inset 0 0 40px rgba(0,0,0,.08), 0 24px 48px rgba(28,35,41,.2); overflow:hidden; }
  .cabinet::after { content:""; position:absolute; top:14px; left:50%; transform:translateX(-50%); width:70%; height:10px; border-radius:10px;
    background:#FFFDF2; box-shadow:0 0 26px 12px rgba(255,250,220,.8); opacity:0; transition:opacity .35s .25s; }
  .fridge.open .cabinet::after { opacity:1; }
  .shelves { position:absolute; inset:26px 18px 20px; display:flex; flex-direction:column; gap:8px; opacity:0; transition:opacity .3s .3s; }
  .fridge.open .shelves { opacity:1; }
  .shelf { flex:1 1 0; min-height:0; background:rgba(255,255,255,.55); border-bottom:4px solid rgba(154,165,174,.55); border-radius:6px;
    padding:6px 8px 4px; overflow:auto; }
  .shelf h3 { margin:0 0 4px; font-size:11px; font-weight:600; color:var(--ink-soft); }
  .items { display:flex; flex-wrap:wrap; gap:5px; }
  .item { width:58px; padding:5px 2px 4px; border-radius:9px; background:#fff; border:1px solid rgba(0,0,0,.08);
    display:flex; flex-direction:column; align-items:center; gap:1px; }
  .item .ico { font-size:20px; line-height:1; }
  .item .nm { font-size:9.5px; line-height:1.1; max-width:54px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { font-size:11px; color:var(--ink-soft); opacity:.7; padding:4px; }
  .door { position:absolute; inset:0; border-radius:18px; transform-origin:left center;
    background:linear-gradient(100deg,#E6EBEF 0%,var(--steel) 55%,#C6CED5 100%);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.6), inset 0 0 0 3px var(--steel-edge), 0 10px 30px rgba(28,35,41,.25);
    transition:transform .75s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; justify-content:space-between; padding:24px; }
  .fridge.open .door { transform:rotateY(-112deg); box-shadow:inset 0 0 0 3px var(--steel-edge), -30px 10px 40px rgba(28,35,41,.22); }
  .door .handle { position:absolute; right:24px; top:50%; transform:translateY(-50%); width:11px; height:170px; border-radius:6px;
    background:linear-gradient(90deg,#fff,var(--steel-edge)); box-shadow:2px 0 6px rgba(0,0,0,.18); }
  .door .brand { font-size:15px; font-weight:700; letter-spacing:.06em; color:var(--ink-soft); }
  .door .memo { background:#FFF6B8; color:#5B4C00; font-size:12.5px; padding:11px 13px; border-radius:3px; transform:rotate(-2deg);
    box-shadow:0 3px 8px rgba(0,0,0,.12); max-width:200px; line-height:1.5; }
  .door .memo b { display:block; margin-bottom:4px; }
  .door .hint { font-size:13px; color:var(--ink-soft); }
  .caption { margin-top:16px; font-size:13px; color:var(--ink-soft); }
  @media (prefers-reduced-motion:reduce) { .door,.shelves,.cabinet::after { transition:none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="fridge" id="fridge" role="button" tabindex="0" aria-label="냉장고 문 열고 시작하기">
    <div class="cabinet"><div class="shelves" id="shelves"></div></div>
    <div class="door">
      <div class="brand">recipang</div>
      <div class="memo" id="memo"><b>나의 냉장고</b></div>
      <div class="hint">냉장고를 눌러 시작하세요</div>
      <div class="handle"></div>
    </div>
  </div>
  <div class="caption" id="caption"></div>
</div>
<script>
  // ---- Streamlit 양방향 컴포넌트 최소 프로토콜 --------------------------------
  function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*"); }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fridge = document.getElementById("fridge");
  let sent = false;
  let signal = true;   // false 면 문만 열고 Streamlit 에 값을 보내지 않는다 (보기 전용)

  function draw(args) {
    signal = args.signal !== false;
    document.querySelector(".door .hint").textContent = signal ? "냉장고를 눌러 시작하세요" : "눌러서 열고 닫기";
    const shelves = args.shelves || [];          // [{label, items:[{name, emoji}]}]
    const el = document.getElementById("shelves");
    el.innerHTML = shelves.map(s => `
      <div class="shelf"><h3>${esc(s.label)} · ${s.items.length}</h3><div class="items">${
        s.items.length ? s.items.map(it => `<span class="item" title="${esc(it.name)}"><span class="ico">${it.emoji}</span><span class="nm">${esc(it.name)}</span></span>`).join("")
                       : '<span class="empty">비어 있음</span>'}</div></div>`).join("")
      || '<div class="shelf"><span class="empty">냉장고가 비어 있어요. 장보기에서 담아 보세요.</span></div>';
    const total = shelves.reduce((n, s) => n + s.items.length, 0);
    document.getElementById("memo").innerHTML = "<b>나의 냉장고</b>" + (total ? `재료 ${total}개` : "비어 있음");
    document.getElementById("caption").textContent = args.caption || "";
  }

  function open() {
    if (fridge.classList.contains("open")) {
      if (!signal) fridge.classList.remove("open");   // 보기 전용이면 다시 눌러 닫을 수 있다
      return;
    }
    fridge.classList.add("open");
    if (!signal || sent) return;
    sent = true;
    // 문이 열리는 걸 보여준 뒤 Streamlit 에 값을 보낸다 → 파이썬 쪽에서 페이지를 바꾼다
    setTimeout(() => send("streamlit:setComponentValue", { value: "open" }), 900);
  }
  fridge.addEventListener("click", open);
  fridge.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });

  window.addEventListener("message", e => {
    if (e.data && e.data.type === "streamlit:render") draw(e.data.args || {});
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 660 });
</script>
</body>
</html>
